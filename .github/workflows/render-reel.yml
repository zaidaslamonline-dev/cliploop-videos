name: Auto-Render Sanatan Reel

on:
  push:
    paths:
      - 'episodes/**'
    paths-ignore:
      - 'episodes/**/audio/**'
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode folder name (e.g. ep-01)'
        required: true
        default: 'ep-01'

permissions:
  contents: write

jobs:
  render:
    # Ignore the initial directory placeholder; render only real episode commits.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'episodes/.gitkeep')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed episode
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EP="${{ github.event.inputs.episode_id }}"
          else
            EP=$(git diff --name-only HEAD~1 HEAD | grep '^episodes/' | cut -d'/' -f2 | head -n 1)
          fi
          if [ -z "$EP" ]; then
            EP=$(ls -1 episodes | grep '^ep-' | sort | tail -n 1)
          fi
          echo "episode=$EP" >> $GITHUB_OUTPUT

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore reusable media bundle
        run: |
          if [ -f sanatan-reel-media-bundle.zip ]; then
            unzip -o sanatan-reel-media-bundle.zip -d .
          fi

      - name: Detect voiceover-only mode
        id: mode
        run: |
          CONFIG="episodes/${{ steps.detect.outputs.episode }}/config.json"
          if [ -f "$CONFIG" ] && [ "$(python -c "import json; print(str(json.load(open('$CONFIG')).get('voiceover_only', False)).lower())")" = "true" ]; then
            echo "voiceover_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "voiceover_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate voiceover MP3 only
        if: steps.mode.outputs.voiceover_only == 'true'
        run: |
          python scripts/build_video.py --episode "${{ steps.detect.outputs.episode }}" --output "dist" --voiceover-only

      - name: Render 9:16 Reel
        if: steps.mode.outputs.voiceover_only != 'true'
        run: |
          python scripts/build_video.py --episode "${{ steps.detect.outputs.episode }}" --output "dist"

      - name: Store reusable voiceover and subtitles in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "episodes/${{ steps.detect.outputs.episode }}/audio/voiceover.mp3" "episodes/${{ steps.detect.outputs.episode }}/audio/captions.srt"
          if ! git diff --cached --quiet; then
            git commit -m "Store generated episode voiceover and subtitles [skip ci]"
            git push
          else
            echo "Voiceover and subtitle assets are already stored; no commit needed."
          fi

      - name: Publish Direct Voiceover Download
        if: steps.mode.outputs.voiceover_only == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.detect.outputs.episode }}-voiceover"
          name: "${{ steps.detect.outputs.episode }} - Voiceover Preview"
          body: "Standalone narration MP3 generated by the repository's Edge TTS pipeline."
          files: |
            dist/${{ steps.detect.outputs.episode }}-voiceover.mp3

      - name: Publish Direct Video Download
        if: steps.mode.outputs.voiceover_only != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.detect.outputs.episode }}-release"
          name: "${{ steps.detect.outputs.episode }} - Ready to Publish"
          body: "Automated 1080x1920 vertical render ready for Instagram Reels, YouTube Shorts, and Facebook."
          files: |
            dist/${{ steps.detect.outputs.episode }}-final.mp4