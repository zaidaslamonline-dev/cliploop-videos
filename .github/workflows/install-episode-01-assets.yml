name: Install Approved Episode 01 Assets

on:
  push:
    paths:
      - '.github/workflows/install-episode-01-assets.yml'
      - 'episodes/ep-01/episode-01-final-upload-bundle.part01'
      - 'episodes/ep-01/episode-01-final-upload-bundle.part02'

permissions:
  contents: write

jobs:
  install-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Join and verify uploaded bundle
        run: |
          cd episodes/ep-01
          test -s episode-01-final-upload-bundle.part01
          test -s episode-01-final-upload-bundle.part02
          cat episode-01-final-upload-bundle.part01 episode-01-final-upload-bundle.part02 > /tmp/episode-01-final-upload-bundle.zip
          unzip -tq /tmp/episode-01-final-upload-bundle.zip
          mkdir -p /tmp/episode-01-extracted
          unzip -q /tmp/episode-01-final-upload-bundle.zip -d /tmp/episode-01-extracted

      - name: Install FFmpeg
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done

      - name: Install approved WAV, exact SRT, and 15 approved scenes
        run: |
          ROOT=/tmp/episode-01-extracted/episode-01-final-upload-bundle
          test -s "$ROOT/audio/voiceover.wav"
          test -s "$ROOT/audio/captions.srt"
          test "$(find "$ROOT/images" -maxdepth 1 -type f -name 'scene-*.png' | wc -l)" -eq 15
          mkdir -p episodes/ep-01/audio episodes/ep-01/images
          cp "$ROOT/audio/voiceover.wav" episodes/ep-01/audio/voiceover.wav
          cp "$ROOT/audio/captions.srt" episodes/ep-01/audio/captions.srt
          cp "$ROOT"/images/scene-*.png episodes/ep-01/images/
          test "$(find episodes/ep-01/images -maxdepth 1 -type f -name 'scene-*.png' | wc -l)" -eq 15
          ffmpeg -y -i episodes/ep-01/audio/voiceover.wav -codec:a libmp3lame -b:a 192k episodes/ep-01/audio/voiceover.mp3
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("episodes/ep-01/config.json")
          cfg = json.loads(p.read_text())
          cfg["voiceover_only"] = False
          cfg["voiceover_approved"] = True
          cfg["voiceover_status"] = "approved_user_recording"
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Commit installed approved assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/ep-01/config.json episodes/ep-01/audio/voiceover.wav episodes/ep-01/audio/voiceover.mp3 episodes/ep-01/audio/captions.srt episodes/ep-01/images
          git commit -m "Install approved Episode 01 voiceover, captions, and scenes"
          git push
